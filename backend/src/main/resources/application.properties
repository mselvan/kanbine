spring.profiles.active=local
spring.application.name=backend

# MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/kanbine}
spring.datasource.username=kanbine
spring.datasource.password=kanbine
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Enable detailed logging for Hibernate (optional, for debugging)
logging.level.org.hibernate=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type=TRACE

# Spring Security Configuration
spring.security.user.name=kanbine
spring.security.user.password=kanbine

# JWT Configuration
kanbine.app.jwtSecret=5e4db59eddb49885d140df068aab649eb0a76cead4ecc28624238c305bb1d7e365021242df58c064b70db6010dcf273cde9d316b649a64be0f2878d6d72beef8can 
kanbine.app.jwtExpirationMs=86400000
